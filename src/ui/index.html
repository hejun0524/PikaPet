<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyPet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bubble" hidden></div>
    <!-- #pet is a one-cell viewport; #sheet is the full spritesheet, moved
         behind it by compositor-driven transform animations (style.css). -->
    <div id="pet" data-anim="idle"><div id="sheet"></div></div>
    <!-- main.js is an ES module entry point: it imports the per-function
         files under main/. -->
    <script type="module" src="main.js"></script>
  </body>
</html>
