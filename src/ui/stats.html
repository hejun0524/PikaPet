<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Huanhuan</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <div id="tray-arrow"></div>
    <div id="panel">
      <button id="tray-collapse" title="Minimize"></button>
      <header>
        <div id="avatar"></div>
        <div class="who">
          <h1 id="pet-name"></h1>
          <p id="breed" class="breed"></p>
          <div id="coins" class="coins-line"></div>
        </div>
      </header>
      <div id="study-status"></div>

      <section id="care-section">
        <h2>Care</h2>
        <div id="care"></div>
      </section>

      <div id="mini-actions">
        <button id="mini-home" title="Home">🏠</button>
        <button id="mini-extensions" title="Extensions">🧩</button>
        <button id="mini-settings" title="Settings">⚙️</button>
      </div>

      <section id="traits-section">
        <h2>Traits</h2>
        <div id="traits"></div>
      </section>

      <h2 id="world-title">World</h2>
      <footer>
        <button id="home" title="Home">🏠</button>
        <button id="shopping" title="Life">🧺</button>
        <button id="career" title="Career">💼</button>
        <button id="touring" title="Touring">🗺️</button>
        <button id="government" title="Pet Center">💖</button>
        <button id="pika" title="Pika's Trading Post">🐱</button>
        <button id="kitchen" title="Noonie's Kitchen">🍳</button>
        <button id="fightclub" title="Darcy's Fight Club">🥊</button>
        <button id="achievements" title="Achievements">🏆</button>
        <button id="addons" title="Extensions">🧩</button>
        <button id="settings" title="Settings">⚙️</button>
      </footer>

      <section id="extensions-section">
        <h2>Quick Launch</h2>
        <div id="extension-row"></div>
      </section>
    </div>
    <div id="widgets"></div>
    <!-- stats.js is an ES module entry point: it imports everything it needs
         (items.js, school.js, career.js, touring.js, panel.js and the
         per-function files under stats/). -->
    <script type="module" src="stats.js"></script>
  </body>
</html>
