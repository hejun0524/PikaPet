<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home &amp; Town</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div id="layout">
      <aside id="side">
        <button id="side-collapse" title="Minimize">⏴</button>
        <header>
          <div id="avatar"></div>
          <div class="who">
            <h1 id="side-name"></h1>
            <p id="side-breed" class="breed"></p>
            <div id="side-coins" class="coins-line"></div>
          </div>
        </header>
        <div id="side-status"></div>

        <section>
          <h2>Care</h2>
          <div id="side-care"></div>
        </section>

        <section>
          <h2>Traits</h2>
          <div id="side-traits"></div>
        </section>

        <h2>World</h2>
        <footer>
          <button data-view="home" title="Home">🏠</button>
          <button data-view="shopping" title="Life">🧺</button>
          <button data-view="career" title="Career">💼</button>
          <button data-view="touring" title="Touring">🗺️</button>
          <button data-view="government" title="Pet Center">💖</button>
          <button data-view="pika" title="Pika's Trading Post">🐱</button>
          <button data-view="kitchen" title="Noonie's Kitchen">🍳</button>
          <button data-view="fightclub" title="Darcy's Fight Club">🥊</button>
          <button data-view="dune" title="Dune's Daily Tasks">🏜️</button>
          <button data-view="achievements" title="Achievements">🏆</button>
          <button data-view="extensions" title="Extensions">🧩</button>
          <button data-view="settings" title="Settings">⚙️</button>
        </footer>

        <section id="side-extensions-section">
          <h2>Quick Launch</h2>
          <div id="side-extensions"></div>
        </section>
      </aside>

      <div id="splitter"></div>

      <section id="content">
        <div id="topbar">
          <button id="extensions-home-btn" hidden title="Back to Extensions">←</button>
          <button id="back-btn" hidden title="Back">←</button>
          <h3 id="view-title"></h3>
          <span class="topbar-spacer"></span>
          <button id="plan-btn" hidden>📔<span id="plan-count" class="badge" hidden></span></button>
          <button id="cart-btn" hidden>🛒<span id="cart-count" class="badge" hidden></span></button>
          <button id="trade-btn" hidden>🤝<span id="trade-count" class="badge" hidden></span></button>
          <button id="service-btn" hidden>🛎️<span id="service-count" class="badge" hidden></span></button>
          <button id="extension-install-btn" hidden title="Install extension from zip">📦</button>
          <button id="market-refresh-btn" hidden title="Refresh marketplace">🔄</button>
        </div>
        <nav id="tabs"></nav>
        <main id="grid"></main>
        <div id="extension-host" hidden></div>
      </section>
    </div>
    <!-- hub.js is an ES module entry point: it imports everything it needs
         (items.js, school.js, career.js, touring.js, panel.js and the
         per-function files under hub/). -->
    <script type="module" src="hub.js"></script>
  </body>
</html>
