<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Huanhuan</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <div id="tray-arrow"></div>
    <div id="panel">
      <header>
        <div id="avatar"></div>
        <div class="who">
          <h1 id="pet-name"></h1>
          <p id="breed" class="breed"></p>
          <div id="coins" class="coins-line"></div>
        </div>
      </header>
      <div id="study-status"></div>

      <section>
        <h2>Care</h2>
        <div id="care"></div>
      </section>

      <section>
        <h2>Traits</h2>
        <div id="traits"></div>
      </section>

      <h2>World</h2>
      <footer>
        <button id="home" title="Home">🏠</button>
        <button id="shopping" title="Shopping">🛒</button>
        <button id="career" title="Career">💼</button>
        <button id="touring" title="Touring">🗺️</button>
        <button id="achievements" title="Achievements">🏆</button>
        <button id="government" title="Pet Center">💖</button>
        <button id="pika" title="Pika">🐱</button>
        <button id="settings" title="Settings">⚙️</button>
      </footer>

      <section>
        <h2>Add-ons</h2>
        <div id="addon-row"></div>
      </section>
    </div>
    <div id="widgets"></div>
    <script src="items.js"></script>
    <script src="school.js"></script>
    <script src="career.js"></script>
    <script src="touring.js"></script>
    <script src="panel.js"></script>
    <script src="stats.js"></script>
  </body>
</html>
